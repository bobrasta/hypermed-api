[build]
builder = "nixpacks"

[deploy]
# Caches config/routes, runs migrations, bootstraps the permission catalog
# (PermissionSeeder no-ops once any role exists — safe on every deploy, never
# re-runs after the first successful seed), then starts the built-in PHP server.
# Railway gives each service a $PORT — artisan serve binds to it automatically.
startCommand = "php artisan config:cache && php artisan route:cache && php artisan migrate --force && php artisan db:seed --class=PermissionSeeder --force && php artisan serve --host=0.0.0.0 --port=$PORT"
healthcheckPath = "/up"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
